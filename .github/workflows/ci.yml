name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build frontend + install server deps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      env:
        # Skip optional native bindings that sometimes fail to install in CI
        NPM_CONFIG_OPTIONAL: 'false'
        # Force building native modules from source in CI
        NPM_CONFIG_BUILD_FROM_SOURCE: 'true'

      - name: Install root dependencies
        run: npm ci --no-optional

      - name: Rebuild native modules (root)
        run: npm rebuild --build-from-source || true

      - name: Build frontend
        run: npm run build

      - name: Install server dependencies
        run: npm ci --prefix server --no-optional

      - name: Rebuild native modules (server)
        run: npm rebuild --build-from-source --prefix server || true
